[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lovarch-cli"
description = "AI-powered architectural project execution CLI by Lovarch"
authors = [{name = "Pablo Ruan Lopes", email = "pablo@archprime.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = [
  "architecture",
  "ai",
  "cad",
  "ifc",
  "bim",
  "italy",
  "lovarch",
  "uni-11337",
  "cila",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering",
  "Natural Language :: Italian",
  "Natural Language :: Portuguese",
  "Natural Language :: English",
  "Natural Language :: Spanish",
]
dependencies = [
  "typer>=0.12,<0.16",
  "httpx>=0.27,<0.29",
  "pydantic>=2.6,<3.0",
  "rich>=13.7,<14.0",
  "keyring>=24.0,<26.0",
  "pyyaml>=6.0,<7.0",
  "ezdxf>=1.3,<2.0",
  "ifcopenshell>=0.7,<0.9",
  "reportlab>=4.0,<5.0",
  "xlsxwriter>=3.2,<4.0",
  "pillow>=10.0,<12.0",
]

[project.scripts]
lovarch = "lovarch_cli.cli:app"
arch = "lovarch_cli.cli:app"

[project.optional-dependencies]
premium = ["supabase>=2.4,<3.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.6",
  "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://archprime.io"
Documentation = "https://lovarch.com/cli-docs"
Repository = "https://github.com/ArchPrime-official/lovarch-cli"
Issues = "https://github.com/ArchPrime-official/lovarch-cli/issues"
Changelog = "https://github.com/ArchPrime-official/lovarch-cli/releases"
Course = "https://lovarch.com/corso"

[tool.hatch.version]
path = "lovarch_cli/version.py"

[tool.hatch.build.targets.wheel]
packages = ["lovarch_cli"]

[tool.hatch.build.targets.sdist]
include = ["/lovarch_cli", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.hooks.custom]
path = "scripts/sync_squad.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "SIM", "RET", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["lovarch_cli/squad/", "tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "premium: marks tests requiring Lovarch credentials",
  "slow: marks tests >5s",
  "integration: marks integration tests",
]
