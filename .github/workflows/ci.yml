name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + pyflakes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyflakes

      - name: pyflakes
        # Exclude lovarch_cli/squad/: it is vendored from the monorepo squad
        # repo (architettura-progetto). Drift fixes belong in that repo.
        run: |
          find lovarch_cli tests -type d -name squad -prune -o -name '*.py' -print | xargs pyflakes

      - name: pytest
        run: pytest tests/ -v --tb=short

  smoke:
    name: smoke test (lovarch info)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: lovarch --version
        run: lovarch --version

      - name: lovarch info (smoke)
        run: lovarch info

      - name: arch alias works
        run: arch --version
