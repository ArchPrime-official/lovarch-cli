name: Publish to PyPI

# Triggered on tag push matching v*.
# Builds wheel + sdist, verifies the tag matches lovarch_cli/version.py,
# uploads to PyPI via twine + PYPI_API_TOKEN secret.
#
# Pre-release tags (v0.1.0-beta.1, v0.1.0-rc.1, etc.) build artifacts and
# attach them to the GitHub Release (via softprops/action-gh-release in
# release.yml) but DO NOT upload to PyPI.
#
# Setup steps (one-time, done by Pablo):
#   1. Create PyPI account at https://pypi.org if not already.
#   2. Reserve the project name by manually uploading the first release once,
#      OR set up Trusted Publishing at
#      https://pypi.org/manage/account/publishing/ (recommended — no token
#      management needed).
#   3. If using a token: create one scoped to lovarch-cli at
#      https://pypi.org/manage/account/token/, then add to repo:
#        gh secret set PYPI_API_TOKEN --repo ArchPrime-official/lovarch-cli
#   4. Cut a release:
#        # bump version in lovarch_cli/version.py (e.g. "0.1.0")
#        git commit -am "chore: bump v0.1.0"
#        git tag v0.1.0 && git push origin main v0.1.0
#        # → workflow triggers → wheel uploads to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      is_prerelease: ${{ steps.read-version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read declared version + classify tag
        id: read-version
        run: |
          version=$(python -c "import re,sys; m=re.search(r'__version__\s*=\s*[\"'\''](.*?)[\"'\'']', open('lovarch_cli/version.py').read()); sys.stdout.write(m.group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "$GITHUB_REF" | grep -qE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Declared version: $version"

      - name: Verify tag matches declared version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          declared="${{ steps.read-version.outputs.version }}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag $tag does not match lovarch_cli/version.py ($declared)" >&2
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect built artifacts
        run: |
          ls -lh dist/
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Skip PyPI upload for pre-release tags (v*-alpha/-beta/-rc/etc).
    if: ${{ needs.build.outputs.is_prerelease == 'false' }}

    environment:
      name: pypi
      url: https://pypi.org/project/lovarch-cli/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload --non-interactive --verbose dist/*
