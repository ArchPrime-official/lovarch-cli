name: Publish to PyPI (manual)

# Status: DORMANT. PyPI publication is deferred — primary distribution is
# Homebrew + pipx-from-git (see README).
#
# Auth: PyPI TRUSTED PUBLISHING (OIDC) — no API token stored anywhere.
# PyPI side: pending publisher for project lovarch-cli, owner
# ArchPrime-official, repo lovarch-cli, workflow publish-pypi.yml,
# environment 'pypi'. Invoke with:
#   gh workflow run publish-pypi.yml -f tag=v0.2.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Must exist on remote."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      is_prerelease: ${{ steps.read-version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read declared version + classify tag
        id: read-version
        run: |
          version=$(sed -nE 's/^__version__ = "(.*)"$/\1/p' lovarch_cli/version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "${{ inputs.tag }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Declared version: $version"

      - name: Verify tag matches declared version
        run: |
          tag="${{ inputs.tag }}"
          tag="${tag#v}"
          declared="${{ steps.read-version.outputs.version }}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Input tag $tag does not match lovarch_cli/version.py ($declared)" >&2
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect built artifacts
        run: |
          ls -lh dist/
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Skip PyPI upload for pre-release tags (v*-alpha/-beta/-rc/etc).
    if: ${{ needs.build.outputs.is_prerelease == 'false' }}

    environment:
      name: pypi
      url: https://pypi.org/project/lovarch-cli/

    # Trusted Publishing: PyPI trusts the OIDC token GitHub mints for this
    # repo+workflow+environment. No long-lived secret to leak or rotate.
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
