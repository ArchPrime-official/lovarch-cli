name: Publish to PyPI (manual)

# Status: DORMANT. PyPI publication is deferred — primary distribution is
# Homebrew + pipx-from-git (see README).
#
# This workflow is kept for the day we activate PyPI. It does NOT run on
# tag push to avoid red CI runs when PYPI_API_TOKEN is unset. To activate:
#
#   1. Create PyPI account + project-scoped token at
#      https://pypi.org/manage/account/token/
#   2. gh secret set PYPI_API_TOKEN --repo ArchPrime-official/lovarch-cli
#   3. (Optional) revert the `on:` trigger below to push/tags/v* to make
#      releases automatic, OR keep workflow_dispatch and invoke manually
#      with `gh workflow run publish-pypi.yml --ref v0.1.0`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Must exist on remote."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      is_prerelease: ${{ steps.read-version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read declared version + classify tag
        id: read-version
        run: |
          version=$(python -c "import re,sys; m=re.search(r'__version__\s*=\s*[\"'\''](.*?)[\"'\'']', open('lovarch_cli/version.py').read()); sys.stdout.write(m.group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "${{ inputs.tag }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Declared version: $version"

      - name: Verify tag matches declared version
        run: |
          tag="${{ inputs.tag }}"
          tag="${tag#v}"
          declared="${{ steps.read-version.outputs.version }}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Input tag $tag does not match lovarch_cli/version.py ($declared)" >&2
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect built artifacts
        run: |
          ls -lh dist/
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Skip PyPI upload for pre-release tags (v*-alpha/-beta/-rc/etc).
    if: ${{ needs.build.outputs.is_prerelease == 'false' }}

    environment:
      name: pypi
      url: https://pypi.org/project/lovarch-cli/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload --non-interactive --verbose dist/*
